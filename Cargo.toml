[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
license-file = "LICENSE"
repository = "https://gitlab.com/yamaura/timezone-map"

[workspace.dependencies]
fast-mvt = "0.6.2"
geo-types = "0.7.19"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
maploom-core = { version = "0.1.0", path = "crates/maploom-core" }
maploom-filter-fast-mvt = { version = "0.1.0", path = "crates/maploom-filter-fast-mvt" }
